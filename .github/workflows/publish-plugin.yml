name: Validate and publish Claude plugin

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.github/workflows/publish-plugin.yml'
      - 'plugins/iridium-claude/**'
      - 'plugins/iridium-memory/**'
      - 'scripts/build_plugin_archive.py'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - '.claude-plugin/**'
      - '.github/workflows/publish-plugin.yml'
      - 'plugins/iridium-claude/**'
      - 'plugins/iridium-memory/**'
      - 'scripts/build_plugin_archive.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Validate marketplace and plugin
        run: python -m pytest -q
      - name: Build installable archives
        run: |
          python scripts/build_plugin_archive.py dist/iridium-claude.zip iridium-claude
          python scripts/build_plugin_archive.py dist/iridium-memory.zip iridium-memory
      - name: Verify install roots
        run: |
          unzip -Z1 dist/iridium-claude.zip | grep -Fx 'iridium-claude/.claude-plugin/plugin.json'
          unzip -Z1 dist/iridium-memory.zip | grep -Fx 'iridium-memory/.claude-plugin/plugin.json'

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installable archives
        run: |
          python scripts/build_plugin_archive.py dist/iridium-claude.zip iridium-claude
          python scripts/build_plugin_archive.py dist/iridium-memory.zip iridium-memory
      - name: Publish immutable version and latest downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release carries both archives, so both stable
          # releases/latest/download links keep resolving.
          version="$(python -c 'import json; print(json.load(open("plugins/iridium-claude/.claude-plugin/plugin.json"))["version"])')"
          memory_version="$(python -c 'import json; print(json.load(open("plugins/iridium-memory/.claude-plugin/plugin.json"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$memory_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Plugin version must use semantic versioning"
            exit 1
          fi

          tag="v${version}-memory.${memory_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$tag" --pattern '*.zip' --dir "$existing"
            if cmp "$existing/iridium-claude.zip" dist/iridium-claude.zip &&
              cmp "$existing/iridium-memory.zip" dist/iridium-memory.zip; then
              exit 0
            fi

            echo "Release ${tag} already contains different plugin contents; bump the plugin version"
            exit 1
          fi

          gh release create "$tag" dist/iridium-claude.zip dist/iridium-memory.zip \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Iridium for Claude: Iridium Memory ${memory_version}, previous plugin ${version}" \
            --notes "Installable Iridium Memory ${memory_version} (iridium-memory.zip) and the previous Iridium plugin ${version} (iridium-claude.zip)."
